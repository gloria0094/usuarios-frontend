<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
    <title>Registro de usuario | Conecta</title>
</head>
<body>
    <nav class="navbar navbar-expand sticky-top">
        <div class="container">
            <a class="navbar-brand marca" href="index.html"><i class="bi bi-people-fill"></i> Conecta</a>
            <ul class="nav nav-pills gap-1">
                <li class="nav-item"><a class="nav-link active" href="registro.html"><i class="bi bi-person-plus"></i> <span class="d-none d-sm-inline">Crear cuenta</span></a></li>
                <li class="nav-item"><a class="nav-link " href="busqueda.html"><i class="bi bi-search"></i> <span class="d-none d-sm-inline">Buscar</span></a></li>
            </ul>
        </div>
    </nav>
    <main class="container py-4 py-lg-5">
        <div class="tarjeta mx-auto shadow-lg" style="max-width: 960px">
            <div class="row g-0">
                <!-- Panel izquierdo -->
                <div class="col-md-5 panel-lateral d-flex flex-column justify-content-center">
                    <h2 class="fw-bold mb-3">Registro de usuario</h2>
                    <p class="mb-4 opacity-75">Únete a Conecta. Solo te toma un minuto.</p>
                    <ul class="list-unstyled small mb-0">
                        <li><i class="bi bi-check-circle-fill"></i> Todos los campos son obligatorios</li>
                        <li><i class="bi bi-check-circle-fill"></i> Usuario de al menos 5 caracteres</li>
                        <li><i class="bi bi-check-circle-fill"></i> Contraseña de al menos 8 caracteres</li>
                        <li><i class="bi bi-check-circle-fill"></i> El correo y el usuario no se pueden repetir</li>
                    </ul>
                </div>

                <!-- Formulario -->
                <div class="col-md-7 p-4 p-lg-5">
                    <div id="mensaje" class="alert d-none" role="alert"></div>

                    <form id="registroForm" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="nombre" class="form-label">Nombre</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" id="nombre" class="form-control" maxlength="50" placeholder="Tu nombre">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label for="apellidoPaterno" class="form-label">Apellido paterno</label>
                                <input type="text" id="apellidoPaterno" class="form-control" maxlength="50">
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="col-sm-6">
                                <label for="apellidoMaterno" class="form-label">Apellido materno</label>
                                <input type="text" id="apellidoMaterno" class="form-control" maxlength="50">
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="col-12">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="correo" class="form-control" maxlength="100" placeholder="nombre@correo.com">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label for="usuario" class="form-label">Usuario</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-at"></i></span>
                                    <input type="text" id="usuario" class="form-control" maxlength="50" placeholder="mín. 5">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" class="form-control" maxlength="100" placeholder="mín. 8">
                                    <button class="btn btn-outline-secondary" type="button" id="verPassword" title="Mostrar contraseña">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                            <div class="col-12">
                                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                                    <input type="date" id="fechaNacimiento" class="form-control">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" id="btnEnviar" class="btn btn-degradado w-100 py-2 rounded-pill">
                                    Crear cuenta
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="text-center py-3 mt-5">
        <span id="pie"></span>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
