<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
    <title>Buscar personas | Conecta</title>
</head>
<body>
    <nav class="navbar navbar-expand sticky-top">
        <div class="container">
            <a class="navbar-brand marca" href="index.html"><i class="bi bi-people-fill"></i> Conecta</a>
            <ul class="nav nav-pills gap-1">
                <li class="nav-item"><a class="nav-link " href="registro.html"><i class="bi bi-person-plus"></i> <span class="d-none d-sm-inline">Crear cuenta</span></a></li>
                <li class="nav-item"><a class="nav-link active" href="busqueda.html"><i class="bi bi-search"></i> <span class="d-none d-sm-inline">Buscar</span></a></li>
            </ul>
        </div>
    </nav>
    <main class="container py-4 py-lg-5" style="max-width: 980px">
        <h1 class="fw-bold text-center mb-1">Buscar personas</h1>
        <p class="text-center text-secondary mb-4">Busca por nombre, apellidos o nombre de usuario</p>

        <form id="buscarForm" class="buscador d-flex align-items-center gap-2 mx-auto mb-2" style="max-width: 640px" novalidate>
            <i class="bi bi-search text-secondary"></i>
            <input type="search" id="q" class="form-control" placeholder="Ej. juan, pérez, @carlast..." autocomplete="off">
            <button type="submit" class="btn btn-degradado">Buscar</button>
        </form>
        <p id="ayuda" class="text-center small text-secondary mb-4">Escribe al menos 3 caracteres</p>

        <div id="aviso" class="alert alert-warning text-center d-none mx-auto" style="max-width: 640px" role="alert"></div>

        <div id="cargando" class="text-center d-none">
            <div class="spinner-border text-light" role="status"></div>
        </div>

        <h6 id="totalResultados" class="text-secondary d-none mb-3"></h6>
        <div id="resultados" class="row g-3"></div>
    </main>
    <footer class="text-center py-3 mt-5">
        <span id="pie"></span>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/busqueda.js"></script>
</body>
</html>
